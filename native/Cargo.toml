[package]
name = "u-and-i"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
eframe = "0.36.2"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi"] }
windows-core = "0.62"
webview2-com = "0.39"
wry = { version = "0.57.3", default-features = false }

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["wgpu"] }
